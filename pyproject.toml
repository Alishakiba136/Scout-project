[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scout"
version = "0.1.0"
description = "SCOUT local embodied AI platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["scout", "scout.app", "scout.brain", "scout.perception", "scout.expression", "scout.memory", "scout.tools", "scout.body"]
